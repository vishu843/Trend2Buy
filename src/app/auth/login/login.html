<!-- login.html -->
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#1f2937] to-[#e5e5e5] relative overflow-hidden p-6">

  <!-- decorative blobs -->
  <div class="blob blob-top"></div>
  <div class="blob blob-bottom"></div>

  <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
    <!-- left: branding & pitch -->
    <div class="px-6 md:px-12">
      <img src="assets/logo.png" alt="Trend2Buy" class="h-14 mb-6 drop-shadow-[0_8px_20px_rgba(0,0,0,0.35)]">
      <h1 class="text-4xl md:text-5xl font-extrabold text-white leading-tight mb-4">
        Welcome back.<br/>
        <span class="text-[#00bcd4]">Glow</span> up your wardrobe.
      </h1>
      <p class="text-gray-300 mb-6 max-w-md">
        Sign in to access exclusive drops, curated fits and lightning deals — made for the Gen-Z vibe.
      </p>

      <div class="flex gap-3 flex-wrap">
        <button class="px-4 py-2 rounded-full bg-[#00bcd4] text-white font-semibold shadow-lg hover:scale-105 transition">Explore</button>
        <button (click)="quickDemo()" class="px-4 py-2 rounded-full border border-white/30 text-white hover:bg-white/5 transition">
          Quick Demo
        </button>
      </div>
    </div>

    <!-- right: login card -->
    <div class="relative">
      <div class="glass-card p-8 rounded-2xl shadow-2xl">
        <h2 class="text-2xl font-bold text-white mb-1">Sign in</h2>
        <p class="text-gray-300 text-sm mb-6">Use your email to continue</p>

        <form (submit)="onSubmit($event)" novalidate>
          <div class="mb-4">
            <label class="block text-sm text-gray-200 mb-2">Email</label>
            <input name="email" type="email" placeholder="you@example.com"
                   class="w-full rounded-xl px-4 py-3 bg-white/5 border border-white/10 placeholder-gray-400 text-white focus:outline-none focus:ring-2 focus:ring-[#00bcd4]/60" />
          </div>

          <div class="mb-3 relative">
            <label class="block text-sm text-gray-200 mb-2">Password</label>
            <input name="password" [type]="showPassword ? 'text' : 'password'"
                   placeholder="••••••••" 
                   class="w-full rounded-xl px-4 py-3 bg-white/5 border border-white/10 placeholder-gray-400 text-white focus:outline-none focus:ring-2 focus:ring-[#00bcd4]/60" />
            <button type="button"
                    (click)="toggleShowPassword()"
                    class="absolute right-3 top-11 text-sm text-gray-200/80">
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>

          <div class="flex items-center justify-between mb-4">
            <label class="inline-flex items-center gap-2 text-sm text-gray-200">
              <input type="checkbox" name="remember" class="w-4 h-4 rounded border-white/20 bg-white/5" />
              Remember me
            </label>
            <a routerLink="/auth/forgot" class="text-sm text-[#00bcd4] hover:underline">Forgot?</a>
          </div>

          <div *ngIf="errorMessage" class="mb-3 text-sm text-red-300">
            {{ errorMessage }}
          </div>

          <button type="submit"
                  class="w-full py-3 rounded-xl bg-gradient-to-r from-[#00bcd4] to-[#0097a7] text-white font-semibold shadow-lg hover:brightness-105 transition mb-3">
            <span *ngIf="!loading">Sign in</span>
            <span *ngIf="loading">Signing in...</span>
          </button>

          <div class="text-center text-sm text-gray-300 mb-2">or</div>

          <div class="grid grid-cols-2 gap-3">
            <button type="button" class="py-2 rounded-xl border border-white/10 flex items-center justify-center gap-2 text-white/90 hover:bg-white/5 transition">
              <!-- Google icon (simple) -->
              <svg class="w-5 h-5" viewBox="0 0 533.5 544.3" fill="currentColor" aria-hidden="true"><path d="M533.5 278.4c0-18.3-1.6-36-4.7-53.1H272v100.4h146.6c-6.4 35.1-26.3 64.9-56.1 84.9l90.8 70.4c53.7-49.6 84.2-122.4 84.2-202.6z"/><path d="M272 544.3c73.7 0 135.6-24.6 180.8-66.8l-90.8-70.4c-25.2 17-57.4 27-90 27-69 0-127.5-46.6-148.5-109.2L33.1 351.2C79.1 448.4 169.5 544.3 272 544.3z"/><path d="M123.5 327.6c-9.6-28.9-9.6-59 0-87.9L33.1 168.8c-39.2 76.3-39.2 163.9 0 240.2l90.4-81.4z"/><path d="M272 107.7c38.7 0 73.8 13.3 101.3 39.4l76-76C405.2 24.1 344 0 272 0 169.5 0 79.1 95.9 33.1 168.8l90.4 81.4C144.5 154.3 203 107.7 272 107.7z"/></svg>
              Continue with Google
            </button>

            <button type="button" class="py-2 rounded-xl border border-white/10 flex items-center justify-center gap-2 text-white/90 hover:bg-white/5 transition">
              <!-- Apple simple icon -->
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.365 1.43c0 1.08-.4 2.06-1.06 2.82-.68.78-1.78 1.34-2.59 1.34.01-1.03.43-2.02 1.09-2.76.66-.75 1.76-1.38 2.56-1.4zM12 6.5c1.1 0 2.14.43 2.92 1.2.78.78 1.25 1.83 1.25 2.95 0 .05 0 .09-.01.14-1.35.1-2.69-.69-3.35-1.21-.28-.22-.88-.7-1.75-.7-.85 0-1.48.47-1.78.7-1.16.92-2.9 2.42-2.9 4.32C6.38 18 7.75 19.5 9.12 20.4c.61.32 1.33.5 2.21.5.83 0 1.53-.19 2.17-.55.72-.4 1.34-.96 1.84-1.66.36-.48.64-.97.85-1.45.4-.95.93-2.3.93-3.44 0-1.18-.2-2.25-.66-3.14-.52-1.06-1.66-2.17-3.36-2.7z"/></svg>
              Continue with Apple
            </button>
          </div>

          <p class="text-xs text-gray-400 mt-4">Don’t have an account? <a routerLink="/auth/register" class="text-[#00bcd4] hover:underline">Sign up</a></p>
        </form>
      </div>

      <!-- small footer text -->
      <p class="mt-4 text-xs text-gray-300/60 text-center">Secure sign-in • 256-bit encryption</p>
    </div>
  </div>
</div>
